<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>계단모임</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #fff7fc;
      color: #222;
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
      padding: 45px 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 35px;
    }

    .title {
      font-size: 38px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 20px;
      color: #777;
    }

    #status {
      text-align: center;
      margin-top: 18px;
      font-size: 15px;
      color: #777;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 28px;
      margin-bottom: 25px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.07);
    }

    h2 {
      margin-top: 0;
      font-size: 24px;
    }

    input {
      width: 100%;
      padding: 18px;
      margin-top: 12px;
      border: 1px solid #ddd;
      border-radius: 16px;
      font-size: 18px;
      outline: none;
    }

    input:focus {
      border-color: #999;
    }

    .quick-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .quick-buttons button {
      border: none;
      border-radius: 14px;
      padding: 14px 4px;
      font-size: 17px;
      font-weight: bold;
      background: #f1f1f1;
      cursor: pointer;
    }

    .save-btn {
      width: 100%;
      margin-top: 15px;
      padding: 18px;
      border: none;
      border-radius: 16px;
      font-size: 19px;
      font-weight: bold;
      background: #222;
      color: white;
      cursor: pointer;
    }

    .save-btn:disabled {
      background: #aaa;
    }

    .ranking-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 4px;
      border-bottom: 1px solid #eee;
    }

    .ranking-item:last-child {
      border-bottom: none;
    }

    .rank-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .rank-number {
      width: 36px;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
    }

    .name {
      font-size: 19px;
      font-weight: bold;
    }

    .floor {
      font-size: 20px;
      font-weight: bold;
    }

    .time {
      margin-top: 5px;
      font-size: 12px;
      color: #999;
    }

    .empty {
      text-align: center;
      padding: 30px 0;
      color: #aaa;
    }

    .delete-btn {
      border: none;
      background: none;
      font-size: 18px;
      cursor: pointer;
      margin-left: 8px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="title">🪜 계단모임</div>
    <div class="subtitle">오늘도 한 층씩 💪</div>
    <div id="status">🔄 Firebase 연결 중...</div>
  </div>

  <div class="card">

    <h2>📝 계단 기록하기</h2>

    <input
      id="name"
      type="text"
      placeholder="이름"
      maxlength="20"
    >

    <input
      id="floor"
      type="number"
      placeholder="몇 층?"
      min="1"
    >

    <div class="quick-buttons">
      <button onclick="setFloor(10)">+10</button>
      <button onclick="setFloor(20)">+20</button>
      <button onclick="setFloor(25)">+25</button>
      <button onclick="setFloor(30)">+30</button>
    </div>

    <button
      id="saveButton"
      class="save-btn"
      onclick="saveRecord()"
      disabled
    >
      연결 중...
    </button>

  </div>

  <div class="card">

    <h2>🏆 실시간 랭킹</h2>

    <div id="ranking">
      <div class="empty">불러오는 중...</div>
    </div>

  </div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getAuth,
  signInAnonymously
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  deleteDoc,
  doc,
  query,
  orderBy,
  onSnapshot,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const firebaseConfig = {

  apiKey: "AIzaSyBjJ1Aoro5jzAtDUYX9BgtDdM3v0C6ctTY",

  authDomain: "stairs-2dd28.firebaseapp.com",

  projectId: "stairs-2dd28",

  storageBucket: "stairs-2dd28.firebasestorage.app",

  messagingSenderId: "950051763953",

  appId: "1:950051763953:web:6fad2beffc2bf5fe481b50",

  measurementId: "G-E3B4HGKMFR"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


const status =
  document.getElementById("status");

const saveButton =
  document.getElementById("saveButton");


let connected = false;


/* ---------------------------
   익명 로그인
--------------------------- */

async function startFirebase() {

  try {

    status.textContent =
      "🔄 익명 로그인 중...";

    await signInAnonymously(auth);

    connected = true;

    status.textContent =
      "🟢 실시간 연결됨";

    saveButton.disabled = false;

    saveButton.textContent =
      "기록 저장";

    startRealtimeRanking();

  }

  catch (error) {

    console.error(error);

    status.textContent =
      "🔴 Firebase 연결 오류";

    saveButton.disabled = true;

    saveButton.textContent =
      "연결 오류";

    alert(
      "Firebase 로그인에 실패했습니다.\n\n" +
      error.code +
      "\n\n" +
      error.message
    );

  }

}


/* ---------------------------
   빠른 층수 선택
--------------------------- */

window.setFloor = function(floor) {

  document.getElementById("floor").value =
    floor;

};


/* ---------------------------
   기록 저장
--------------------------- */

window.saveRecord = async function() {

  if (!connected) {

    alert("Firebase 연결 중입니다.");

    return;

  }


  const name =
    document.getElementById("name")
      .value
      .trim();

  const floor =
    Number(
      document.getElementById("floor")
        .value
    );


  if (!name) {

    alert("이름을 입력해주세요.");

    return;

  }


  if (!floor || floor < 1) {

    alert("층수를 입력해주세요.");

    return;

  }


  try {

    saveButton.disabled = true;

    saveButton.textContent =
      "저장 중...";


    await addDoc(
      collection(db, "records"),
      {
        name: name,
        floor: floor,
        createdAt: serverTimestamp()
      }
    );


    document.getElementById("floor").value =
      "";


    saveButton.textContent =
      "저장 완료!";


    setTimeout(() => {

      saveButton.disabled = false;

      saveButton.textContent =
        "기록 저장";

    }, 700);

  }

  catch (error) {

    console.error(error);

    alert(
      "저장 실패\n\n" +
      error.code +
      "\n" +
      error.message
    );

    saveButton.disabled = false;

    saveButton.textContent =
      "기록 저장";

  }

};


/* ---------------------------
   기록 삭제
--------------------------- */

window.deleteRecord =
async function(id) {

  const ok =
    confirm("이 기록을 삭제할까요?");

  if (!ok) return;


  try {

    await deleteDoc(
      doc(db, "records", id)
    );

  }

  catch (error) {

    console.error(error);

    alert(
      "삭제 실패\n" +
      error.message
    );

  }

};


/* ---------------------------
   실시간 랭킹
--------------------------- */

function startRealtimeRanking() {

  const ranking =
    document.getElementById("ranking");


  const q =
    query(
      collection(db, "records"),
      orderBy("floor", "desc")
    );


  onSnapshot(
    q,

    snapshot => {

      ranking.innerHTML = "";


      if (snapshot.empty) {

        ranking.innerHTML =
          '<div class="empty">아직 기록이 없어요 🪜</div>';

        return;

      }


      let rank = 1;


      snapshot.forEach(item => {

        const data =
          item.data();


        let medal =
          rank;


        if (rank === 1)
          medal = "🥇";

        if (rank === 2)
          medal = "🥈";

        if (rank === 3)
          medal = "🥉";


        let timeText = "";


        if (
          data.createdAt &&
          data.createdAt.toDate
        ) {

          const date =
            data.createdAt.toDate();

          timeText =
            date.toLocaleString(
              "ko-KR"
            );

        }


        const div =
          document.createElement("div");


        div.className =
          "ranking-item";


        div.innerHTML = `

          <div class="rank-left">

            <div class="rank-number">
              ${medal}
            </div>

            <div>

              <div class="name">
                ${escapeHtml(data.name)}
              </div>

              <div class="time">
                ${timeText}
              </div>

            </div>

          </div>


          <div>

            <span class="floor">
              ${data.floor}층
            </span>

            <button
              class="delete-btn"
              onclick="deleteRecord('${item.id}')"
            >
              🗑️
            </button>

          </div>

        `;


        ranking.appendChild(div);


        rank++;

      });

    },

    error => {

      console.error(error);

      ranking.innerHTML =
        '<div class="empty">랭킹을 불러오지 못했습니다.</div>';

      alert(
        "Firestore 읽기 오류\n\n" +
        error.code +
        "\n" +
        error.message
      );

    }

  );

}


/* ---------------------------
   HTML 문자 처리
--------------------------- */

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text || "";

  return div.innerHTML;

}


/* ---------------------------
   시작
--------------------------- */

startFirebase();

</script>

</body>
</html>
