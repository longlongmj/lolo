<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff8fc">

  <title>계단모임</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", "Noto Sans KR", sans-serif;
      background: #fff8fc;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 30px 18px 70px;
    }

    h1 {
      text-align: center;
      margin: 10px 0 5px;
      font-size: 30px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 20px;
    }

    .status {
      text-align: center;
      font-size: 13px;
      margin-bottom: 18px;
      color: #777;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 3px 15px rgba(0,0,0,.06);
    }

    h2 {
      margin-top: 0;
      font-size: 19px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      background: white;
    }

    .mainButton {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 12px;
      background: #222;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .mainButton:disabled {
      opacity: .5;
    }

    .record {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 14px 2px;
      border-bottom: 1px solid #eee;
    }

    .record:last-child {
      border-bottom: none;
    }

    .recordName {
      font-weight: bold;
    }

    .recordInfo {
      color: #666;
      font-size: 14px;
      margin-top: 4px;
    }

    .deleteButton {
      flex-shrink: 0;
      border: none;
      border-radius: 10px;
      padding: 8px 10px;
      background: #eee;
      color: #666;
    }

    .ranking {
      padding: 13px 2px;
      border-bottom: 1px solid #eee;
      font-size: 17px;
    }

    .ranking:last-child {
      border-bottom: none;
    }

    .empty {
      text-align: center;
      padding: 20px 0;
      color: #999;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🪜 계단모임</h1>

  <div class="subtitle">
    오늘도 한 층씩 💪
  </div>

  <div id="status" class="status">
    🔄 Firebase 연결 중...
  </div>


  <div class="card">

    <h2>📝 계단 기록하기</h2>

    <input
      id="name"
      type="text"
      placeholder="이름"
    >

    <input
      id="floors"
      type="number"
      inputmode="numeric"
      min="1"
      placeholder="몇 층?"
    >

    <button
      id="saveButton"
      class="mainButton"
      disabled
    >
      연결 중...
    </button>

  </div>


  <div class="card">

    <h2>🏆 실시간 랭킹</h2>

    <div id="ranking">
      <div class="empty">
        불러오는 중...
      </div>
    </div>

  </div>


  <div class="card">

    <h2>📋 최근 기록</h2>

    <div id="records">
      <div class="empty">
        불러오는 중...
      </div>
    </div>

  </div>

</div>


<script type="module">

/* ===============================
   Firebase 불러오기
================================ */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


import {
  getAuth,
  signInAnonymously
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


import {
  getFirestore,
  collection,
  addDoc,
  deleteDoc,
  doc,
  onSnapshot,
  serverTimestamp,
  query,
  orderBy
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* ===============================
   Firebase 설정
================================ */

const firebaseConfig = {
  apiKey: "AIzaSyBjJIAoro5jzAtDUYX9BgtDdM3v0C6ctTY",
  authDomain: "stairs-2dd28.firebaseapp.com",
  projectId: "stairs-2dd28",
  storageBucket: "stairs-2dd28.firebasestorage.app",
  messagingSenderId: "950051763953",
  appId: "1:950051763953:web:6fad2beffc2bf5fe481b50",
  measurementId: "G-E3B4HGKMFR"
};

/* ===============================
   Firebase 시작
================================ */

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* ===============================
   화면 요소
================================ */

const statusBox =
  document.getElementById("status");

const nameInput =
  document.getElementById("name");

const floorsInput =
  document.getElementById("floors");

const saveButton =
  document.getElementById("saveButton");

const rankingBox =
  document.getElementById("ranking");

const recordsBox =
  document.getElementById("records");


/* ===============================
   이름 기억
================================ */

const oldName =
  localStorage.getItem("stairs-name");

if (oldName) {
  nameInput.value = oldName;
}


/* ===============================
   날짜 만들기
================================ */

function getToday() {

  const now = new Date();

  const year =
    now.getFullYear();

  const month =
    String(now.getMonth() + 1)
      .padStart(2, "0");

  const day =
    String(now.getDate())
      .padStart(2, "0");

  return `${year}-${month}-${day}`;
}


/* ===============================
   익명 로그인
================================ */

async function startFirebase() {

  try {

    statusBox.textContent =
      "🔄 로그인 중...";

    await signInAnonymously(auth);

    statusBox.textContent =
      "🟢 실시간 연결됨";

    saveButton.disabled = false;

    saveButton.textContent =
      "기록 저장";

    startRealtime();

  }

  catch (error) {

    console.error(error);

    statusBox.textContent =
      "🔴 Firebase 로그인 오류";

    saveButton.disabled = true;

    saveButton.textContent =
      "연결 실패";

    alert(
      "Firebase 로그인에 실패했습니다.\n\n" +
      error.message
    );
  }
}


/* ===============================
   기록 저장
================================ */

saveButton.addEventListener(
  "click",
  async () => {

    const name =
      nameInput.value.trim();

    const floors =
      Number(floorsInput.value);


    if (!name) {

      alert("이름을 입력해주세요.");

      return;
    }


    if (
      !Number.isFinite(floors) ||
      floors < 1
    ) {

      alert("층수를 입력해주세요.");

      return;
    }


    if (!auth.currentUser) {

      alert(
        "Firebase 로그인이 아직 완료되지 않았습니다."
      );

      return;
    }


    try {

      saveButton.disabled = true;

      saveButton.textContent =
        "저장 중...";


      await addDoc(
        collection(db, "records"),
        {

          uid:
            auth.currentUser.uid,

          name:
            name,

          floors:
            floors,

          date:
            getToday(),

          createdAt:
            serverTimestamp()

        }
      );


      localStorage.setItem(
        "stairs-name",
        name
      );


      floorsInput.value = "";

    }

    catch (error) {

      console.error(error);

      alert(
        "기록 저장 실패\n\n" +
        error.message
      );

    }

    finally {

      saveButton.disabled = false;

      saveButton.textContent =
        "기록 저장";

    }

  }
);


/* ===============================
   실시간 Firestore
================================ */

function startRealtime() {

  const q =
    query(
      collection(db, "records"),
      orderBy("createdAt", "desc")
    );


  onSnapshot(

    q,

    snapshot => {

      const records = [];


      snapshot.forEach(item => {

        records.push({

          id:
            item.id,

          ...item.data()

        });

      });


      statusBox.textContent =
        "🟢 실시간 연결됨";


      showRanking(records);

      showRecords(records);

    },


    error => {

      console.error(error);

      statusBox.textContent =
        "🔴 Firestore 연결 오류";

      alert(
        "Firestore 데이터를 읽지 못했습니다.\n\n" +
        error.message
      );

    }

  );

}


/* ===============================
   랭킹
================================ */

function showRanking(records) {

  const totals = {};


  records.forEach(record => {

    const name =
      record.name || "이름 없음";


    /*
      Android/웹 데이터 모두 대응

      floors가 있으면 floors 사용
      예전 floor 데이터가 있으면 floor 사용
    */

    const floors =
      Number(
        record.floors ??
        record.floor ??
        0
      );


    if (!totals[name]) {

      totals[name] = 0;

    }


    totals[name] += floors;

  });


  const ranking =
    Object.entries(totals)
      .sort(
        (a, b) =>
          b[1] - a[1]
      );


  rankingBox.innerHTML = "";


  if (ranking.length === 0) {

    rankingBox.innerHTML =
      '<div class="empty">아직 기록이 없습니다.</div>';

    return;
  }


  ranking.forEach(
    ([name, floors], index) => {

      const div =
        document.createElement("div");

      div.className =
        "ranking";


      let rank;


      if (index === 0) {

        rank = "🥇";

      }

      else if (index === 1) {

        rank = "🥈";

      }

      else if (index === 2) {

        rank = "🥉";

      }

      else {

        rank =
          `${index + 1}.`;

      }


      div.textContent =
        `${rank} ${name} — ${floors}층`;


      rankingBox.appendChild(div);

    }
  );

}


/* ===============================
   최근 기록
================================ */

function showRecords(records) {

  recordsBox.innerHTML = "";


  if (records.length === 0) {

    recordsBox.innerHTML =
      '<div class="empty">아직 기록이 없습니다.</div>';

    return;
  }


  records.forEach(record => {

    const row =
      document.createElement("div");

    row.className =
      "record";


    const left =
      document.createElement("div");


    const name =
      document.createElement("div");

    name.className =
      "recordName";

    name.textContent =
      record.name || "이름 없음";


    const info =
      document.createElement("div");

    info.className =
      "recordInfo";


    const floors =
      Number(
        record.floors ??
        record.floor ??
        0
      );


    let dateText =
      record.date || "";


    if (
      record.createdAt &&
      typeof record.createdAt.toDate === "function"
    ) {

      const d =
        record.createdAt.toDate();

      dateText =
        d.toLocaleString(
          "ko-KR",
          {
            month: "numeric",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit"
          }
        );
    }


    info.textContent =
      `${floors}층 · ${dateText}`;


    left.appendChild(name);

    left.appendChild(info);


    const deleteButton =
      document.createElement("button");

    deleteButton.className =
      "deleteButton";

    deleteButton.textContent =
      "삭제";


    deleteButton.addEventListener(
      "click",
      async () => {

        const ok =
          confirm(
            `${record.name || ""}님의 ${floors}층 기록을 삭제할까요?`
          );


        if (!ok) return;


        try {

          await deleteDoc(
            doc(
              db,
              "records",
              record.id
            )
          );

        }

        catch (error) {

          console.error(error);

          alert(
            "삭제 실패\n\n" +
            error.message
          );

        }

      }
    );


    row.appendChild(left);

    row.appendChild(deleteButton);

    recordsBox.appendChild(row);

  });

}


/* ===============================
   시작!
================================ */

startFirebase();

</script>

</body>
</html>
